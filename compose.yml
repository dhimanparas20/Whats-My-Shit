services:

  waha:
    container_name: waha
    restart: always
    image: devlikeapro/waha

    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

    ports:
      - '3000:3000/tcp'

    networks:
      - app-network

    volumes:
      # Store sessions in the .sessions folder (comment it if you're using MongoDB)
      - './sessions:/app/.sessions'

      # Save media files
      # https://waha.devlike.pro/docs/how-to/storages/#save-media-files-between-the-container-restarts
      - './media:/app/.media'

    env_file:
      - .env

    healthcheck:
      # /health runs real checks (engine, sessions) — needs X-Api-Key
      # (/ping is the unauthenticated liveness-only fallback)
      test: [
        "CMD-SHELL",
        "curl -fsS -H \"X-Api-Key: $$WAHA_API_KEY\" http://localhost:3000/health || exit 1",
      ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 5s


  huey:
    build:
      context: .
    image: wms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    networks:
      - app-network
    volumes:
      - ./modules:/app/modules
      - ./configs:/app/configs
      - ./models:/app/models
      - ./services:/app/services
      # Persist ipython profile (history.sqlite etc.) across rebuilds.
      # MUST be listed BEFORE the startup-file mount below, so the file
      # mount lands on top of the directory mount.
      - ./.ipython:/app/.ipython
      - ./modules/ipython_startup.py:/app/.ipython/profile_default/startup/auto_reload.py
      - ./tasks:/app/tasks
    command: uv run huey_consumer tasks.huey -k thread -w 1 --flush-locks info
    healthcheck:
      test: [
        "CMD-SHELL",
        "python -c \"import os,sys; import redis; r=redis.Redis.from_url(os.getenv('REDIS_URL')); sys.exit(0 if r.ping() else 1)\""
      ]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

